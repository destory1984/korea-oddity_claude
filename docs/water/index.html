<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Korea Oddity — 할머니의 수첩</title>
<link rel="stylesheet" href="../assets/fonts/pretendard/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="../assets/fonts/nanum-pen-script/400.css">
<link rel="stylesheet" href="../assets/fonts/gaegu/400.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <!-- 위쪽 줄: 왼쪽은 유이의 지갑, 오른쪽은 수첩, 효과음, 설정. 아이콘은 우주 한량(1권)의 것이다. -->
  <header id="top">
    <div id="wallet"></div>
    <nav id="nav">
      <button id="journalButton"></button>
      <button id="soundButton"></button>
      <button id="settingsButton"></button>
    </nav>
  </header>
  <!-- 지금 있는 곳과 이 쪽에서 모은 것 -->
  <div id="where">
    <h1 id="place"></h1>
    <div id="found"></div>
  </div>
  <section id="screen"></section>
  <p id="note" class="note"></p>
</main>

<div id="journal" class="modal"><div>
  <h1 id="journalTitle"></h1>
  <section id="journalBody"></section>
  <button id="closeJournal" class="closer"></button>
</div></div>

<!-- 설정: 1권의 설정 창과 같은 꼴. 머리에 판 번호와 글자 크기 단추, 갈래는 Options, Help, Changes, About 이다. -->
<div id="settings" class="modal"><div>
  <div class="sheetHead"><h1 id="settingsTitle"></h1><small id="appVersion"></small><div class="textSize" role="group"><button data-way="-1">가<span aria-hidden="true">−</span></button><button data-way="1">가<span aria-hidden="true">+</span></button></div></div>
  <div id="settingsTabs" role="tablist"><button role="tab" data-tab="options">Options</button><button role="tab" data-tab="help">Help</button><button role="tab" data-tab="news">Changes</button><button role="tab" data-tab="about">About</button></div>
  <section data-tab="options"><dl>
    <dt>언어 · Language</dt><dd id="langRow"><button data-lang="ko" lang="ko">한국어</button><button data-lang="en" lang="en">English</button><button data-lang="ja" lang="ja">日本語</button><button data-lang="zh" lang="zh-Hans">中文</button></dd>
    <dt id="soundTerm"></dt><dd><button id="soundSwitch"></button></dd>
    <dt id="testTerm"></dt><dd><button id="restartButton"></button></dd>
  </dl></section>
  <section data-tab="help" hidden><p id="helpLead"></p><dl id="helpList"></dl></section>
  <section data-tab="news" hidden><p id="newsStarted"></p><ul id="newsList"></ul></section>
  <section data-tab="about" hidden><dl id="aboutList"></dl></section>
  <button id="closeSettings" class="closer"></button>
</div></div>

<script src="../assets/changes.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
