<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>팔도 한량 사진 포개기 손맛 시험</title>
<style>
/* 손맛만 보려고 만든 시험판이다. 게임 코드가 아니다. 땅 그림은 임시로 그린 것이고, 절기 날짜는 어림이다. */
:root{--night:#050330;--navy:#1a2894;--gold:#f6b951;--white:#fbf8f9;--lav:#e2daf6;--paper:#f2e6c8;--ink:#3b2a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#15122b;overflow:hidden;overscroll-behavior:none}
body{display:grid;place-items:center;font-family:"Malgun Gothic",system-ui,sans-serif;color:var(--white);user-select:none;-webkit-user-select:none}
#ph{position:relative;width:min(100vw,420px);height:min(100dvh,860px);overflow:hidden;background:#141c7c}
#ph>*{position:absolute}
canvas.full{inset:0;width:100%;height:100%;pointer-events:none}
.glass{background:rgba(5,3,48,.6);border:1px solid rgba(226,218,246,.45);border-radius:16px}
#date{top:14px;left:16px;pointer-events:none;text-shadow:0 1px 6px rgba(5,3,48,.7)}
#date b{display:block;font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
#date{max-width:46%}
#date span{display:block;font-size:13px;line-height:1.3}
#name{top:112px;left:16px;font-size:12px;padding:4px 10px;pointer-events:none}
/* 위쪽 단추 줄과 설정 창: 우주 한량(1권)의 유리 단추와 아이콘(assets/ui/icon-*.svg)을 그대로 옮겼다. */
#nav{top:14px;right:14px;display:flex;gap:9px}
#nav button,#settings button{border:1px solid #9fb4ff66;border-radius:12px;background:#0d1a3acc;box-shadow:0 2px 10px #0006;color:#eef3ff;font:inherit}
#nav button{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:44px;min-height:44px;padding:0;font-size:0}
#nav button::before{content:"";flex:none;width:24px;height:24px;background:center / contain no-repeat}
#nav button:active,#settings button:active{border-color:var(--gold);background:#1c2f6ae6}
#nav #journalButton{font-size:9px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
#nav #journalButton::before{width:19px;height:19px;background-image:url("assets/ui/icon-journal.svg")}
#nav #soundButton::before{background-image:url("assets/ui/icon-sound-on.svg")}
#nav #soundButton.off::before{background-image:url("assets/ui/icon-sound-off.svg")}
#nav #bgmButton::before{background-image:url("assets/ui/icon-music-on.svg")}
#nav #bgmButton.off::before{background-image:url("assets/ui/icon-music-off.svg")}
#nav #settingsButton::before{background-image:url("assets/ui/icon-settings.svg")}
#nav .off{opacity:.8}
#toast{left:50%;bottom:150px;transform:translateX(-50%);padding:7px 13px;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
#settings{inset:0;background:rgba(5,3,48,.62);display:none;place-items:center}
#settings.on{display:grid}
#settings>div{width:86%;background:var(--paper);color:var(--ink);border-radius:14px;padding:16px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#settings h1{margin:0 0 10px;font-size:19px}
#settings dt{font-size:12px;opacity:.75;margin-top:10px}
#settings dd{margin:5px 0 0;font-size:13px;line-height:1.5;display:flex;flex-wrap:wrap;gap:6px}
#settings button{padding:8px 13px;font-size:13px}
#settings button.on{background:var(--gold);border-color:var(--gold);color:var(--night);font-weight:600}
#settings #closeSettings{margin-top:14px;width:100%}
#jump{right:14px;top:70px;padding:9px 14px;color:var(--gold);border-color:var(--gold);font:inherit;font-size:13px}
#hint{left:50%;transform:translateX(-50%);padding:6px 12px;font-size:12px;white-space:nowrap;transition:opacity .4s;pointer-events:none}
#memo{left:14px;max-width:70%;background:var(--paper);color:var(--ink);padding:6px 10px 5px;transform:rotate(-1.5deg);
  box-shadow:1px 2px 0 rgba(59,42,26,.4);pointer-events:none}
/* 손글씨 글꼴: 한국어는 나눔손글씨 펜, 일본어는 Yomogi, 중국어는 Ma Shan Zheng(모두 구글 글꼴, OFL). 메모는 고른 말 하나로만 적는다. */
#memo b{display:block;font-family:"Nanum Pen Script","Gowun Batang",cursive;font-weight:400;font-size:21px;line-height:1.15}
:lang(ja) #memo b,:lang(ja) #card .hand{font-family:"Yomogi","Nanum Pen Script",cursive;font-size:16px;line-height:1.3}
:lang(zh-Hans) #memo b,:lang(zh-Hans) #card .hand{font-family:"Ma Shan Zheng","Nanum Pen Script",cursive;font-size:18px;line-height:1.3}
#sora{left:10px;bottom:118px;width:84px;image-rendering:pixelated;pointer-events:none}
#bubble{left:88px;bottom:190px;background:var(--white);color:#1b1730;padding:6px 10px;border-radius:12px 12px 12px 2px;
  font-size:12.5px;white-space:nowrap;transition:opacity .25s;opacity:0;pointer-events:none}
#fly,#hit{touch-action:none;cursor:grab}
#fly{left:0;right:0;top:0;bottom:120px}
#hit{left:0;right:0;bottom:0;height:120px}
#flash{inset:0;background:#fff;opacity:0;pointer-events:none}
#post{left:50%;transform:translateX(-50%) rotate(-1.2deg);background:#f7efd9;color:var(--ink);padding:10px 10px 6px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);display:none}
#post div{display:flex;gap:6px}
#post canvas{display:block;border:1px solid #cbb98c;border-radius:6px}
#post p{margin:6px 2px 0;display:flex;justify-content:space-between;font-family:"Nanum Pen Script","Gowun Batang",cursive;font-size:20px;line-height:1.1}
/* 수첩: 단추를 누르면 열린다. 지도와 칸 두 갈래. 종이와 제본은 2권의 화면 어림에서 가져왔다. */
#journal{inset:0;background:rgba(5,3,48,.62);display:none}
#journal.on{display:block}
#journal .book{position:absolute;left:12px;right:12px;top:12px;bottom:12px;background:var(--paper);color:var(--ink);border-radius:6px 14px 14px 6px;border-left:12px solid #6b4a2b;
  padding:14px 12px 0 12px;font-family:"Gowun Batang","Malgun Gothic",serif;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}
#journal header{display:flex;align-items:baseline;gap:8px}
#journal h1{margin:0;font-size:19px}
#journal header small{font-size:12px;font-variant-numeric:tabular-nums}
#closeJournal{margin-left:auto;border:1px solid var(--ink);border-radius:8px;background:none;color:var(--ink);font:inherit;font-size:14px;width:34px;height:34px}
#journalTabs{display:flex;gap:4px;margin-top:8px;border-bottom:2px solid var(--ink)}
#journalTabs button{padding:5px 16px;border:1px solid var(--ink);border-bottom:0;border-radius:7px 7px 0 0;background:none;color:var(--ink);font:inherit;font-size:13px}
#journalTabs button.on{background:var(--ink);color:var(--paper)}
#journal section{flex:1;min-height:0;display:none;flex-direction:column}
#journal section.on{display:flex}
#mapCanvas{width:100%;flex:1;min-height:0;touch-action:none}
#mapCard{margin:0;padding:8px 2px 10px;border-top:1px dashed #b9a777;font-size:13px;line-height:1.45;min-height:84px}
#mapCard b{font-size:15px}
#mapCard button{margin-top:6px;border:1px solid var(--ink);border-radius:8px;background:var(--ink);color:var(--paper);font:inherit;font-size:13px;padding:6px 14px}
#journalList{overflow-y:auto;padding-bottom:12px}
#journalList h2{margin:12px 0 2px;font-size:13px;border-bottom:1px solid var(--ink)}
#journalList div{display:grid;grid-template-columns:26px 1fr auto;gap:0 6px;padding:5px 0;border-bottom:1px dashed #b9a777;font-size:13px;align-items:baseline}
#journalList div.done{background:rgba(246,185,81,.25)}
#journalList i{font-style:normal;font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
#journalList em{font-style:normal;font-size:11px;opacity:.75}
#journalList small{grid-column:2/4;font-size:11px;opacity:.7}
/* 이야기 카드와 가는 길: 접혀 있고 눌러야 펼쳐진다(기획서 4절). */
#chips{right:14px;display:grid;gap:6px;justify-items:end}
#chips button{padding:7px 12px;color:var(--white);font:inherit;font-size:12px}
#card{inset:0;background:rgba(5,3,48,.62);display:none;place-items:center}
#card.on{display:grid}
#card>div{width:88%;background:var(--paper);color:var(--ink);border-radius:6px;padding:16px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-family:"Gowun Batang","Malgun Gothic",serif}
#card h1{margin:0 0 8px;font-size:18px;border-bottom:2px solid var(--ink);padding-bottom:6px}
#card p{margin:6px 0;font-size:14px;line-height:1.6}
#card ol{margin:6px 0;padding-left:20px;font-size:14px;line-height:1.7}
#card .hand{font-family:"Nanum Pen Script","Gowun Batang",cursive;font-size:21px;line-height:1.2;margin-top:10px}
#card .quiz{border-top:1px dashed #b9a777;margin-top:10px;padding-top:8px}
#card .pick{display:flex;gap:6px;margin-top:6px}
#card button{border:1px solid var(--ink);border-radius:8px;background:none;color:var(--ink);font:inherit;font-size:14px;padding:7px 14px}
#card button.right{background:var(--gold);border-color:var(--gold)}
#card button.wrong{opacity:.45;text-decoration:line-through}
#card #closeCard{margin-top:14px;width:100%;background:var(--ink);color:var(--paper)}
#again{left:50%;transform:translateX(-50%);padding:9px 16px;color:var(--white);font:inherit;font-size:13px;display:none}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">

</head>

    <button id="closeSettings"></button>
  </div></div>
</div>
<script src="assets/music.js"></script>
<script src="assets/squares.js"></script>
<script src="assets/sun.js"></script>

  const glass = k.createRadialGradient(cx, cy, R - 110, cx, cy, R);
  glass.addColorStop(0, '#0a1046'); glass.addColorStop(1, '#1b2a7a');
  k.fillStyle = glass; k.beginPath(); k.arc(cx, cy, R, 0, 6.2832); k.fill();
  k.strokeStyle = GOLD; k.lineWidth = 2.5; k.stroke();
  k.lineWidth = 1; k.beginPath(); k.arc(cx, cy, R - 5, 0, 6.2832); k.stroke();
  // 별자리 무늬: 다이얼과 함께 돈다. 점선 동심원 둘, 네 갈래 별, 별을 잇는 줄.
  k.strokeStyle = PALE; k.setLineDash([3, 4]);
  for (const r of [R - 74, R - 104]) { k.beginPath(); k.arc(cx, cy, r, 0, 6.2832); k.stroke(); }
  k.setLineDash([]);
  k.textAlign = 'center'; k.textBaseline = 'middle';
  for (let n = Math.floor(dv - span); n <= dv + span; n++) {
    const m = mod(n, YEAR), mi = MONTH0.indexOf(m), term = TERM_AT.get(m), isTick = mod(n - TODAY, STEP) === 0, deco = DECO.get(m);
    if (!isTick && mi < 0 && term === undefined && !deco) continue;
    k.save(); k.translate(cx, cy); k.rotate((n - dv) * z / R);
    if (isTick) { k.fillStyle = GOLD; k.fillRect(-0.5, -R + 9, 1, 9); }
    if (mi >= 0) { k.fillStyle = GOLD; k.fillRect(-1.5, -R + 9, 3, 19); k.font = '13px "Gowun Batang",Georgia,serif'; k.fillText(`${mi + 1}${t('month')}`, 0, -R + 41); }
    if (term !== undefined) { k.fillStyle = 'rgba(233,196,106,.8)'; k.font = '11px "Gowun Batang","Malgun Gothic",serif'; k.fillText(TERM_NAMES[lang][term], 0, -R + 59); }
    if (deco) {
      k.strokeStyle = PALE; k.lineWidth = 1; k.beginPath(); k.moveTo(0, -R + deco.r); k.lineTo(deco.dx, -R + deco.r2); k.stroke();
      star4(k, 0, -R + deco.r, deco.s, 'rgba(233,196,106,.7)');
    }
    if (m === mod(GOOD, YEAR)) {   // 좋은 때 옆의 빛나는 별
      k.shadowColor = '#ffe9a8'; k.shadowBlur = 10; star4(k, 11, -R + 19, 6.5, '#fff3c4'); k.shadowBlur = 0;
    }
    k.restore();
  }
  const needle = k.createLinearGradient(0, H - 116, 0, H - 96);
  needle.addColorStop(0, '#f8dc8a'); needle.addColorStop(1, '#c9962e');
  k.fillStyle = needle; k.beginPath(); k.moveTo(cx - 9, H - 116); k.lineTo(cx + 9, H - 116); k.lineTo(cx, H - 97); k.fill();
  $('date').firstElementChild.textContent = dateText(d);
  $('date').lastElementChild.textContent = `${termOf(d)} · ${t('where')} · ${t('sunset')} ${clockText(sunTimes(PLACE.lat, PLACE.lon, mod(Math.round(d), YEAR)).set)}`;
  $('jump').textContent = gap(Math.round(d), GOOD) === 0 ? t('today') : t('good');
  $('journalButton').textContent = `${filled.size}/100`;
}

// ── 소리 ────────────────────────────────────────────────────────────
// 눈금 소리는 시간 한량의 다이얼 시험판에서 그대로 옮겼다. 중심 1,200Hz, 달이 바뀌는 눈금은 760Hz.
let ac = null, music = null, noise = null, lastClick = 0, lastIdx = null;
function wake() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); if (typeof createMusic === 'function') { music = createMusic(ac, ac.destination); music.set(musicOn); } noise = ac.createBuffer(1, ac.sampleRate * 0.045, ac.sampleRate);
    const b = noise.getChannelData(0);
    for (let i = 0; i < b.length; i++) b[i] = (Math.random() * 2 - 1) * Math.exp(-i / (b.length * 0.18));
  }
  if (ac.state === 'suspended') ac.resume();
}
addEventListener('pointerdown', wake);
function burst(freq, vol, when = 0) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), v = ac.createGain();
  s.buffer = noise; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.0; v.gain.value = vol;
  s.connect(f); f.connect(v); v.connect(ac.destination); s.start(ac.currentTime + when);
}
function click(big) {
  const now = performance.now(); if (!ac || muted || now - lastClick < 22) return; lastClick = now;
  burst(big ? 760 : 1200, big ? 0.75 : 0.5);
  const o = ac.createOscillator(), og = ac.createGain(), t0 = ac.currentTime;
  o.type = 'sine'; o.frequency.setValueAtTime(big ? 240 : 340, t0); o.frequency.exponentialRampToValueAtTime(big ? 130 : 190, t0 + 0.035);
  og.gain.setValueAtTime(big ? 0.22 : 0.12, t0); og.gain.exponentialRampToValueAtTime(0.001, t0 + 0.04);
  o.connect(og); og.connect(ac.destination); o.start(t0); o.stop(t0 + 0.06);
}
function shutter() { if (!ac || muted) return; burst(2400, 0.9); burst(900, 0.8, 0.07); }   // 셔터가 열리고 닫히는 소리(임시)
function sound() {
  const idx = Math.round((d - TODAY) / STEP);
  if (lastIdx !== null && idx !== lastIdx && target === null) {
    const a = Math.min(idx, lastIdx) * STEP + TODAY, b = Math.max(idx, lastIdx) * STEP + TODAY;
    click(MONTH0.some(m0 => mod(m0 - a - 1, YEAR) < b - a));   // 이 걸음에 달이 바뀌었는가
  }
  lastIdx = idx;
}

// ── 위쪽 단추와 설정 ────────────────────────────────────────────────
const MUTE_KEY = 'koreaoddity.muted', MUSIC_KEY = 'koreaoddity.music';
const stored = (key, fallback) => { try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; } };
const store = (key, value) => { try { localStorage.setItem(key, value); } catch { /* 저장하지 못해도 이번에는 바뀐다 */ } };
let muted = stored(MUTE_KEY, '0') === '1', musicOn = stored(MUSIC_KEY, '1') === '1', toastTimer = 0;   // filled: 채운 칸 수. 시험판에는 칸이 하나뿐이다.
function toast(text) { const el = $('toast'); el.textContent = text; el.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.style.opacity = 0; }, 1600); }
function showSound() {
  $('soundButton').classList.toggle('off', muted); $('bgmButton').classList.toggle('off', !musicOn);
  $('soundSwitch').textContent = `${t('sound')}: ${muted ? t('off') : t('on')}`; $('soundSwitch').classList.toggle('on', !muted);
  $('musicSwitch').textContent = `${t('music')}: ${musicOn ? t('on') : t('off')}`; $('musicSwitch').classList.toggle('on', musicOn);
}
// 소리나 음악을 끄면 소라가 손가락을 입에 대고 "쉬잇~" 한다. 1권에서 그대로 가져왔다(그림 넉 장을 1초에 넉 장씩 한 번, 3초 동안).
const HUSH_S = 3, HUSH_FPS = 4;
for (let i = 1; i <= 4; i++) new Image().src = `assets/sora/see-hush-${i}.png`;   // 미리 받아 둔다
let hushAt = -1, hushHold = false;
function hush() { hushAt = performance.now(); $('bubble').textContent = t('hush'); $('bubble').style.opacity = 1; }
function showSora(now) {
  if (hushAt < 0) return;
  const sec = (now - hushAt) / 1000;
  if (sec < HUSH_S || hushHold) { $('sora').src = `assets/sora/see-hush-${Math.min(4, Math.floor(sec * HUSH_FPS) + 1)}.png`; return; }
  hushAt = -1; $('sora').src = 'mock/sora.png';
  if (shot) $('bubble').textContent = t('bubble'); else $('bubble').style.opacity = 0;
}
const flipSound = () => { muted = !muted; store(MUTE_KEY, muted ? '1' : '0'); showSound(); if (muted) hush(); };
const flipMusic = () => { musicOn = !musicOn; store(MUSIC_KEY, musicOn ? '1' : '0'); if (music) music.set(musicOn); showSound(); if (!musicOn) hush(); };
$('soundButton').onclick = $('soundSwitch').onclick = flipSound;
$('bgmButton').onclick = $('musicSwitch').onclick = flipMusic;

// ── 이야기 카드와 가는 길 ───────────────────────────────────────────
// 문제의 보기는 해 셋이다. 고르면 할머니의 말이 손글씨로 뜬다.
const QUIZ = { choices: ['576', '676', '776'], answer: '676' };
let cardKind = 'story';
function openCard(kind) {
  cardKind = kind;
  $('cardTitle').textContent = `${nameOf(squares.find(x => x.id === HERE) ?? { ko: '부석사' })} · ${t(kind)}`;
  if (kind === 'story') {
    $('cardBody').innerHTML = t('card').map(line => `<p>${line}</p>`).join('') +
      `<div class="quiz"><p><b>${t('quizHead')}</b> ${t('quiz')}</p><div class="pick">${QUIZ.choices.map(c => `<button data-c="${c}">${c}</button>`).join('')}</div><p class="hand" id="quizSay"></p></div>`;
    $('cardBody').querySelectorAll('.pick button').forEach(b => { b.onclick = () => {
      const ok = b.dataset.c === QUIZ.answer;
      $('cardBody').querySelectorAll('.pick button').forEach(x => x.classList.toggle('right', x.dataset.c === QUIZ.answer));
      if (!ok) b.classList.add('wrong');
      $('quizSay').textContent = t(ok ? 'right' : 'wrong');
    }; });
  } else {
    $('cardBody').innerHTML = `<ol>${t('routes').map(line => `<li>${line}</li>`).join('')}</ol><p class="hand">${t('check')}</p>`;
  }
  $('card').classList.add('on');
}
$('storyButton').onclick = () => openCard('story');
$('routeButton').onclick = () => { if (filled.has(HERE)) openCard('route'); else toast(t('routeLocked')); };
$('closeCard').onclick = () => $('card').classList.remove('on');
$('card').onclick = e => { if (e.target === $('card')) $('card').classList.remove('on'); };

// ── 수첩 ────────────────────────────────────────────────────────────
// 칸 100개(assets/squares.js). 시험판에 그림이 있는 칸은 68번 부석사 하나다. 채운 칸은 기억한다.
const HERE = 'buseoksa', FILLED_KEY = 'koreaoddity.filled.v1';
const squares = typeof SQUARES === 'undefined' ? [] : SQUARES;
const filled = new Set(stored(FILLED_KEY, '').split(',').filter(Boolean));
function fill(id) { filled.add(id); store(FILLED_KEY, [...filled].join(',')); showJournal(); }
const REGION_COLOR = { '서울·경기·인천': '#3b5bb5', '강원': '#2f8f7a', '충청': '#b5803b', '전라': '#5a8c4a', '경상': '#b9502c', '제주': '#8a4fa8', '섬과 끝': '#3b2a1a' };
// 그 말의 이름 하나만 보인다(한글을 나란히 적지 않는다). 일본어와 중국어에 아직 이름이 없는 칸만 한글이 보인다.
const nameOf = sq => lang === 'ja' ? sq.ja ?? sq.ko : lang === 'zh' ? sq.zh ?? sq.ko : sq.ko;
let picked = null, journalTab = 'map';

function showJournal() {
  $('journalTitle').textContent = t('journalTitle'); $('journalCount').textContent = `${filled.size}/100`;
  document.querySelectorAll('#journalTabs button').forEach(b => { b.textContent = t(b.dataset.tab === 'map' ? 'tabMap' : 'tabList'); b.classList.toggle('on', b.dataset.tab === journalTab); });
  document.querySelectorAll('#journal section').forEach(el => el.classList.toggle('on', el.dataset.tab === journalTab));
  let html = '', region = null;
  for (const sq of squares) {
    if (sq.region !== region) { region = sq.region; html += `<h2>${t('regions')[region]}</h2>`; }
    html += `<div data-id="${sq.id}" class="${filled.has(sq.id) ? 'done' : ''}"><i>${sq.no}</i><b>${nameOf(sq)}</b><em>${t(sq.grandma)}</em><small>${lang === 'ko' ? sq.where + ' · ' + sq.what : ''}</small></div>`;
  }
  $('journalList').innerHTML = html;
  showCard();
  if ($('journal').classList.contains('on') && journalTab === 'map') drawMap();
}
function showCard() {
  const sq = squares.find(x => x.id === picked);
  if (!sq) { $('mapCard').textContent = t('pick'); return; }
  const sub = [lang === 'ko' ? sq.where : '', t(sq.grandma)].filter(Boolean).join(' · ');
  $('mapCard').innerHTML = `<b>${sq.no} ${nameOf(sq)}</b><br>${sub}${lang === 'ko' ? '<br>' + sq.what + ' · ' + sq.best : ''}${sq.rough ? '<br><small>' + t('rough') + '</small>' : ''}<br><button id="goSquare">${t('go')}</button>`;
  $('goSquare').onclick = () => { if (sq.id === HERE) { $('journal').classList.remove('on'); toast(t('here')); } else toast(t('noArt')); };
}
// 지도: 땅은 Natural Earth 의 바닷가 선(assets/coast.js)이고, 그 위에 칸 100개의 점을 찍는다.
const MAP = { lon0: 124.4, lon1: 131.1, lat0: 33.0, lat1: 38.8, squeeze: Math.cos(36 * Math.PI / 180) };
let mapDots = [];
function drawMap() {
  const c = $('mapCanvas'), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (!r.width) return;
  c.width = r.width * dpr; c.height = r.height * dpr;
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const wu = (MAP.lon1 - MAP.lon0) * MAP.squeeze, hu = MAP.lat1 - MAP.lat0, k = Math.min((r.width - 16) / wu, (r.height - 16) / hu);
  const ox = (r.width - wu * k) / 2, oy = (r.height - hu * k) / 2;
  const X = lon => ox + (lon - MAP.lon0) * MAP.squeeze * k, Y = lat => oy + (MAP.lat1 - lat) * k;
  g.save(); g.beginPath(); g.rect(ox, oy, wu * k, hu * k); g.clip();
  g.fillStyle = '#e3d3a6'; g.strokeStyle = '#a8946a'; g.lineWidth = 1; g.lineJoin = 'round';
  for (const land of typeof COAST === 'undefined' ? [] : COAST) {
    g.beginPath();
    for (let i = 0; i < land.length; i += 2) g.lineTo(X(land[i]), Y(land[i + 1]));
    g.closePath(); g.fill(); g.stroke();
  }
  g.restore();
  g.strokeStyle = 'rgba(59,42,26,.12)'; g.lineWidth = 1;   // 위도와 경도 1도마다 옅은 줄
  for (let lon = 125; lon <= 131; lon++) { const x = ox + (lon - MAP.lon0) * MAP.squeeze * k; g.beginPath(); g.moveTo(x, oy); g.lineTo(x, oy + hu * k); g.stroke(); }
  for (let lat = 33; lat <= 38; lat++) { const y = oy + (MAP.lat1 - lat) * k; g.beginPath(); g.moveTo(ox, y); g.lineTo(ox + wu * k, y); g.stroke(); }
  mapDots = squares.map(sq => ({ sq, x: ox + (sq.lon - MAP.lon0) * MAP.squeeze * k, y: oy + (MAP.lat1 - sq.lat) * k }));
  for (const { sq, x, y } of mapDots) {
    g.beginPath(); g.arc(x, y, filled.has(sq.id) ? 6 : 4.2, 0, 6.2832);
    g.fillStyle = filled.has(sq.id) ? '#f6b951' : REGION_COLOR[sq.region]; g.globalAlpha = filled.has(sq.id) ? 1 : 0.8; g.fill(); g.globalAlpha = 1;
    if (filled.has(sq.id)) { g.strokeStyle = '#3b2a1a'; g.lineWidth = 1.5; g.stroke(); }
  }
  const p = mapDots.find(d => d.sq.id === picked);
  if (p) { g.strokeStyle = '#3b2a1a'; g.lineWidth = 2; g.beginPath(); g.arc(p.x, p.y, 10, 0, 6.2832); g.stroke(); }
}
$('mapCanvas').addEventListener('pointerdown', e => {
  const r = $('mapCanvas').getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let best = null, bd = 22;
  for (const d of mapDots) { const q = Math.hypot(d.x - x, d.y - y); if (q < bd) { bd = q; best = d; } }
  if (best) { picked = best.sq.id; showCard(); drawMap(); }
});
$('journalList').onclick = e => { const row = e.target.closest('div[data-id]'); if (row) { picked = row.dataset.id; journalTab = 'map'; showJournal(); } };
document.querySelectorAll('#journalTabs button').forEach(b => { b.onclick = () => { journalTab = b.dataset.tab; showJournal(); }; });
$('journalButton').onclick = () => { $('journal').classList.add('on'); showJournal(); };
$('closeJournal').onclick = () => $('journal').classList.remove('on');
addEventListener('resize', () => { if ($('journal').classList.contains('on')) drawMap(); });
$('settingsButton').onclick = () => $('settings').classList.add('on');
$('closeSettings').onclick = () => $('settings').classList.remove('on');
$('settings').onclick = e => { if (e.target === $('settings')) $('settings').classList.remove('on'); };
document.querySelectorAll('#langRow button').forEach(b => { b.onclick = () => setLang(b.dataset.lang); });
setLang(lang);

let prev = performance.now();
function loop(now) {
  const dt = Math.min(50, now - prev); prev = now;
  tick(dt); sound(); if (music) music.tick('near'); showSora(now);
  if (!(dragging || Math.abs(vp) > 0.015)) dv += (d - dv) * Math.min(1, dt * 0.01);
  drawAll(); requestAnimationFrame(loop);
}
addEventListener('resize', layout);
layout();
// 주소 끝에 #near 나 #shot 을 붙이면 그 장면에서 시작한다. 화면을 그림 파일로 찍을 때 쓴다.
if (location.hash === '#near' || location.hash === '#shot') { d = dv = GOOD; $('hint').style.opacity = 0; cam.x = TARGET.x - 22; cam.y = TARGET.y + 9; }
if (location.hash === '#shot') { cam.x = TARGET.x; cam.y = TARGET.y; touched = true; }
if (location.hash === '#settings') $('settings').classList.add('on');
if (location.hash === '#story') openCard('story');
if (location.hash === '#route') openCard('route');
if (location.hash === '#journal' || location.hash === '#list') { picked = HERE; journalTab = location.hash === '#list' ? 'list' : 'map'; $('journal').classList.add('on'); showJournal(); }
if (location.hash === '#hush') { muted = true; showSound(); hush(); hushHold = true; }   // 넷째 그림에서 멈춘다
requestAnimationFrame(loop);
</script>
</body>
</html>
