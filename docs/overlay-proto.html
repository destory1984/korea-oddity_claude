<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>팔도 한량 사진 포개기 손맛 시험</title>
<style>
/* 손맛만 보려고 만든 시험판이다. 게임 코드가 아니다. 땅 그림은 임시로 그린 것이고, 절기 날짜는 어림이다. */
:root{--night:#050330;--navy:#1a2894;--gold:#f6b951;--white:#fbf8f9;--lav:#e2daf6;--paper:#f2e6c8;--ink:#3b2a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#15122b;overflow:hidden;overscroll-behavior:none}
body{display:grid;place-items:center;font-family:"Pretendard Variable",Pretendard,"Segoe UI","Malgun Gothic",sans-serif;color:var(--white);user-select:none;-webkit-user-select:none}
#ph{position:relative;width:min(100vw,420px);height:min(100dvh,860px);overflow:hidden;background:#141c7c}
#ph>*{position:absolute}
canvas.full{inset:0;width:100%;height:100%;pointer-events:none}
.glass{background:rgba(5,3,48,.6);border:1px solid rgba(226,218,246,.45);border-radius:16px}
#date{top:14px;left:16px;pointer-events:none;text-shadow:0 1px 6px rgba(5,3,48,.7)}
#date b{display:block;font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
#date{max-width:46%}
#date span{display:block;font-size:13px;line-height:1.3}
#name{top:112px;left:16px;font-size:12px;padding:4px 10px;pointer-events:none}
/* 위쪽 단추 줄과 설정 창: 우주 한량(1권)의 유리 단추와 아이콘(assets/ui/icon-*.svg)을 그대로 옮겼다. */
#nav{top:14px;right:14px;display:flex;gap:9px}
#nav button,#settings button{border:1px solid #9fb4ff66;border-radius:12px;background:#0d1a3acc;box-shadow:0 2px 10px #0006;color:#eef3ff;font:inherit}
#nav button{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:44px;min-height:44px;padding:0;font-size:0}
#nav button::before{content:"";flex:none;width:24px;height:24px;background:center / contain no-repeat}
#nav button:active,#settings button:active{border-color:var(--gold);background:#1c2f6ae6}
#nav #journalButton{font-size:9px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
#nav #journalButton::before{width:19px;height:19px;background-image:url("assets/ui/icon-journal.svg")}
#nav #soundButton::before{background-image:url("assets/ui/icon-sound-on.svg")}
#nav #soundButton.off::before{background-image:url("assets/ui/icon-sound-off.svg")}
#nav #bgmButton::before{background-image:url("assets/ui/icon-music-on.svg")}
#nav #bgmButton.off::before{background-image:url("assets/ui/icon-music-off.svg")}
#nav #settingsButton::before{background-image:url("assets/ui/icon-settings.svg")}
#nav .off{opacity:.8}
#toast{left:50%;bottom:150px;transform:translateX(-50%);padding:7px 13px;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
#settings{inset:0;background:rgba(5,3,48,.62);display:none;place-items:center}
#settings.on{display:grid}
#settings>div{width:86%;background:var(--paper);color:var(--ink);border-radius:14px;padding:16px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#settings h1{margin:0 0 10px;font-size:19px}
#settings dt{font-size:12px;opacity:.75;margin-top:10px}
#settings dd{margin:5px 0 0;font-size:13px;line-height:1.5;display:flex;flex-wrap:wrap;gap:6px}
#settings button{padding:8px 13px;font-size:13px}
#settings button.on{background:var(--gold);border-color:var(--gold);color:var(--night);font-weight:600}
#settings #closeSettings{margin-top:14px;width:100%}
/* 설정의 갈래: Options 와 Changes. 1권의 설정에서 가져온 꼴이다. */
#settings>div{max-height:calc(min(100dvh,860px) * .86);display:flex;flex-direction:column}
#settingsTabs{display:flex;gap:8px;margin:0 0 12px}
#settings #settingsTabs button{flex:1 1 0;min-height:38px;padding:6px 10px;font-size:13px}
#settings #settingsTabs button[aria-selected="true"]{border-color:var(--gold);color:var(--gold);font-weight:600}
#settings section{overflow-y:auto;min-height:0}
#settings section[hidden]{display:none}
#newsStarted{white-space:pre-line;margin:0 0 8px;font-size:12px;opacity:.8}
#newsList{margin:0;padding:0;list-style:none}
#newsList li{display:grid;grid-template-columns:38px 1fr;gap:0 6px;padding:7px 0;border-bottom:1px solid rgba(59,42,26,.18);font-size:14px;line-height:1.55;overflow-wrap:anywhere}
/* 한국어만 낱말 사이에서 줄을 바꾼다. 일본어와 중국어는 띄어쓰기가 없어 그렇게 하면 줄이 화면 밖으로 나간다. */
:lang(ko) #newsList li,:lang(ko) #newsStarted{word-break:keep-all}
#newsList time{color:#9a6a1c;font-size:12px;font-variant-numeric:tabular-nums;line-height:1.8}
#hint{left:50%;transform:translateX(-50%);padding:6px 12px;font-size:12px;white-space:nowrap;transition:opacity .4s;pointer-events:none}
#memo{left:14px;max-width:70%;background:var(--paper);color:var(--ink);padding:6px 10px 5px;transform:rotate(-1.5deg);
  box-shadow:1px 2px 0 rgba(59,42,26,.4);pointer-events:none}
/* 손글씨 글꼴: 한국어는 나눔손글씨 펜, 일본어는 Yomogi, 중국어는 Ma Shan Zheng(모두 구글 글꼴, OFL). 메모는 고른 말 하나로만 적는다. */
#memo b{display:block;font-family:"Nanum Pen Script","Gowun Batang",cursive;font-weight:400;font-size:21px;line-height:1.15}
:lang(ja) #memo b,:lang(ja) #card .hand{font-family:"Yomogi","Nanum Pen Script",cursive;font-size:16px;line-height:1.3}
:lang(zh-Hans) #memo b,:lang(zh-Hans) #card .hand{font-family:"Ma Shan Zheng","Nanum Pen Script",cursive;font-size:18px;line-height:1.3}
#sora{left:10px;bottom:118px;width:84px;image-rendering:pixelated;pointer-events:none}
#bubble{left:88px;bottom:190px;background:var(--white);color:#1b1730;padding:6px 10px;border-radius:12px 12px 12px 2px;
  font-family:"Gaegu","Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;font-size:18px;line-height:1.2;white-space:nowrap;transition:opacity .25s;opacity:0;pointer-events:none}
#fly,#hit{touch-action:none;cursor:grab}
#fly{left:0;right:0;top:0;bottom:120px}
#hit{left:0;right:0;bottom:0;height:120px}
#flash{inset:0;background:#fff;opacity:0;pointer-events:none}
#post{left:50%;transform:translateX(-50%) rotate(-1.2deg);background:#f7efd9;color:var(--ink);padding:10px 10px 6px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);display:none}
#post div{display:flex;gap:6px}
#post canvas{display:block;border:1px solid #cbb98c;border-radius:6px}
#post #pm,#post #pdm{display:none}
#post.three #pm{display:block}
#post.three #pdm{display:inline}
#post.three p{font-size:16px}
#post p{margin:6px 2px 0;display:flex;justify-content:space-between;font-family:"Nanum Pen Script","Gowun Batang",cursive;font-size:20px;line-height:1.1}
/* 수첩: 단추를 누르면 열린다. 지도와 칸 두 갈래. 종이와 제본은 2권의 화면 어림에서 가져왔다. */
#journal{inset:0;background:rgba(5,3,48,.62);display:none}
#journal.on{display:block}
#journal .book{position:absolute;left:12px;right:12px;top:12px;bottom:12px;background:var(--paper);color:var(--ink);border-radius:6px 14px 14px 6px;border-left:12px solid #6b4a2b;
  padding:14px 12px 0 12px;font-family:"Gowun Batang","Malgun Gothic",serif;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}
#journal header{display:flex;align-items:baseline;gap:8px}
#journal h1{margin:0;font-size:19px}
#journal header small{font-size:12px;font-variant-numeric:tabular-nums}
#closeJournal{margin-left:auto;border:1px solid var(--ink);border-radius:8px;background:none;color:var(--ink);font:inherit;font-size:14px;width:34px;height:34px}
#journalTabs{display:flex;gap:4px;margin-top:8px;border-bottom:2px solid var(--ink)}
#journalTabs button{padding:5px 16px;border:1px solid var(--ink);border-bottom:0;border-radius:7px 7px 0 0;background:none;color:var(--ink);font:inherit;font-size:13px}
#journalTabs button.on{background:var(--ink);color:var(--paper)}
#journal section{flex:1;min-height:0;display:none;flex-direction:column}
#journal section.on{display:flex}
#mapCanvas{width:100%;flex:1;min-height:0;touch-action:none}
#mapCard{margin:0;padding:8px 2px 10px;border-top:1px dashed #b9a777;font-size:13px;line-height:1.45;min-height:84px}
#mapCard b{font-size:15px}
#mapCard button{margin-top:6px;border:1px solid var(--ink);border-radius:8px;background:var(--ink);color:var(--paper);font:inherit;font-size:13px;padding:6px 14px}
#journalList{overflow-y:auto;padding-bottom:12px}
#journalList h2{margin:12px 0 2px;font-size:13px;border-bottom:1px solid var(--ink)}
#journalList div{display:grid;grid-template-columns:26px 1fr auto;gap:0 6px;padding:5px 0;border-bottom:1px dashed #b9a777;font-size:13px;align-items:baseline}
#journalList div.done{background:rgba(246,185,81,.25)}
#journalList b.real::after{content:" ★";color:#b5803b}
#mapCard button+button{margin-left:6px;background:none;color:var(--ink)}
#journalList i{font-style:normal;font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
#journalList em{font-style:normal;font-size:11px;opacity:.75}
#journalList small{grid-column:2/4;font-size:11px;opacity:.7}
/* 이야기 카드와 가는 길: 접혀 있고 눌러야 펼쳐진다(기획서 4절). */
#chips{right:14px;display:grid;gap:6px;justify-items:end}
/* 내 사진: 관광객이 그 자리에서 정말 찍은 사진. 이 기기에만 남는다. */
#mine{inset:0;background:rgba(5,3,48,.62);display:none;place-items:center}
#mine.on{display:grid}
#mine>div{width:88%;background:var(--paper);color:var(--ink);border-radius:6px;padding:16px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-family:"Gowun Batang","Malgun Gothic",serif}
#mine h1{margin:0 0 8px;font-size:18px;border-bottom:2px solid var(--ink);padding-bottom:6px}
#mine img{display:none;width:100%;border:1px solid #cbb98c;border-radius:6px;margin-bottom:8px}
#mine img.on{display:block}
#mine p{margin:6px 0;font-size:13px;line-height:1.55}
#mine .hand{font-family:"Nanum Pen Script","Gowun Batang",cursive;font-size:21px;line-height:1.2;min-height:1.2em}
#mine .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#mine button,#mine label{border:1px solid var(--ink);border-radius:8px;background:none;color:var(--ink);font:inherit;font-size:14px;padding:8px 14px;cursor:pointer}
#mine label input{display:none}
#mine #closeMine{margin-top:12px;width:100%;background:var(--ink);color:var(--paper)}
#cam{inset:0;background:#000;display:none}
#cam.on{display:block}
#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#camGhost{position:absolute;left:50%;transform:translateX(-50%);border:3px solid var(--white);border-radius:12px;box-shadow:0 0 0 2000px rgba(5,3,48,.45);pointer-events:none}
#camHint{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:6px 12px;font-size:12px;white-space:nowrap}
#camBar{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;align-items:center;gap:22px}
#camBar button{color:var(--white);font:inherit;font-size:13px;padding:9px 14px}
#camBar #camShoot{width:68px;height:68px;border-radius:50%;background:var(--white);border:4px solid var(--gold);padding:0}
#chips button{padding:7px 12px;color:var(--white);font:inherit;font-size:12px}
#card{inset:0;background:rgba(5,3,48,.62);display:none;place-items:center}
#card.on{display:grid}
#card>div{width:88%;background:var(--paper);color:var(--ink);border-radius:6px;padding:16px 16px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-family:"Gowun Batang","Malgun Gothic",serif}
#card h1{margin:0 0 8px;font-size:18px;border-bottom:2px solid var(--ink);padding-bottom:6px}
#card p{margin:6px 0;font-size:14px;line-height:1.6}
#card ol{margin:6px 0;padding-left:20px;font-size:14px;line-height:1.7}
#card .hand{font-family:"Nanum Pen Script","Gowun Batang",cursive;font-size:21px;line-height:1.2;margin-top:10px}
#card .quiz{border-top:1px dashed #b9a777;margin-top:10px;padding-top:8px}
#card .pick{display:flex;gap:6px;margin-top:6px}
#card button{border:1px solid var(--ink);border-radius:8px;background:none;color:var(--ink);font:inherit;font-size:14px;padding:7px 14px}
#card button.right{background:var(--gold);border-color:var(--gold)}
#card button.wrong{opacity:.45;text-decoration:line-through}
#card #closeCard{margin-top:14px;width:100%;background:var(--ink);color:var(--paper)}
#again{left:50%;transform:translateX(-50%);padding:9px 16px;color:var(--white);font:inherit;font-size:13px;display:none}
</style>
<!-- 글씨는 1권, 2권과 같은 세 벌이다: 화면은 Pretendard, 할머니는 나눔손글씨 펜, 소라는 개구. 파일을 함께 싣는다. -->
<link rel="stylesheet" href="assets/fonts/pretendard/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="assets/fonts/nanum-pen-script/400.css">
<link rel="stylesheet" href="assets/fonts/gaegu/400.css">
<!-- 일본어와 중국어의 손글씨만 구글 글꼴 서버에서 받는다(임시). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
</head>
<body>
<div id="ph">
  <canvas id="scene" class="full"></canvas>
  <canvas id="dial" class="full"></canvas>
  <div id="memo"><b></b></div>
  <img id="sora" src="mock/sora.png" alt="소라">
  <div id="bubble"></div>
  <div id="date"><b></b><span></span></div>
  <div id="name" class="glass"></div>
  <div id="hint" class="glass"></div>
  <div id="fly"></div>
  <div id="hit"></div>
  <nav id="nav">
    <button id="journalButton"></button>
    <button id="soundButton"></button>
    <button id="bgmButton"></button>
    <button id="settingsButton"></button>
  </nav>
  <div id="chips"><button id="storyButton" class="glass"></button><button id="routeButton" class="glass"></button><button id="mineButton" class="glass"></button></div>
  <div id="toast" class="glass"></div>
  <div id="post"><div><canvas id="pl"></canvas><canvas id="pr"></canvas><canvas id="pm"></canvas></div><p><span id="pd0"></span><span id="pd"></span><span id="pdm"></span></p></div>
  <button id="again" class="glass"></button>
  <div id="flash"></div>
  <div id="journal"><div class="book">
    <header><h1 id="journalTitle"></h1><small id="journalCount"></small><button id="closeJournal" aria-label="닫기">✕</button></header>
    <div id="journalTabs"><button data-tab="map"></button><button data-tab="list"></button></div>
    <section data-tab="map"><canvas id="mapCanvas"></canvas><p id="mapCard"></p></section>
    <section data-tab="list" id="journalList"></section>
  </div></div>
  <div id="mine"><div>
    <h1 id="mineTitle"></h1>
    <img id="mineShow" alt="">
    <p class="hand" id="mineSay"></p>
    <p id="mineNote"></p>
    <div class="row"><button id="mineCam"></button><label><span id="mineFileText"></span><input id="mineFile" type="file" accept="image/*"></label><button id="mineDrop"></button></div>
    <button id="closeMine"></button>
  </div></div>
  <div id="cam">
    <video id="camVideo" playsinline muted></video>
    <canvas id="camGhost"></canvas>
    <div id="camHint" class="glass"></div>
    <div id="camBar"><button id="camToggle" class="glass"></button><button id="camShoot" aria-label="찍기"></button><button id="camClose" class="glass"></button></div>
  </div>
  <div id="card"><div><h1 id="cardTitle"></h1><div id="cardBody"></div><button id="closeCard"></button></div></div>
  <div id="settings"><div>
    <h1 id="settingsTitle"></h1>
    <div id="settingsTabs" role="tablist"><button role="tab" data-tab="options">Options</button><button role="tab" data-tab="news">Changes</button></div>
    <section data-tab="news" hidden><p id="newsStarted"></p><ul id="newsList"></ul></section>
    <section data-tab="options"><dl>
      <dt>언어 · Language</dt><dd id="langRow"><button data-lang="ko" lang="ko">한국어</button><button data-lang="ja" lang="ja">日本語</button><button data-lang="zh" lang="zh-Hans">中文</button></dd>
      <dt id="soundTerm"></dt><dd><button id="soundSwitch"></button><button id="musicSwitch"></button></dd><dd id="soundNote"></dd>
    </dl></section>
    <button id="closeSettings"></button>
  </div></div>
</div>

<script>
const $ = id => document.getElementById(id);
const ph = $('ph'), scene = $('scene'), dial = $('dial'), fly = $('fly'), hit = $('hit');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mod = (v, n) => ((v % n) + n) % n;
const smooth = t => t * t * (3 - 2 * t);

// 지명과 절기는 고른 말 하나로만 적는다. 한자와 한글을 나란히 적지 않는다(사용자, 2026.10.7).

    sunset: '해 짐', month: '월', sound: '효과음', music: '배경 음악', settings: '설정', close: '닫기', soundTerm: '소리', on: '켜짐', off: '꺼짐',
    soundNote: '배경 음악은 스무 곡이 돌아가며 흐릅니다. 위쪽의 스피커 단추와 음표 단추로도 켜고 끕니다.', noJournal: '수첩은 아직 없습니다.', mine: '내 사진', mineTitle: '내가 찍은 사진', mineCam: '그 자리에서 찍기', mineFile: '사진첩에서 고르기', mineDrop: '지우기', mineNote: '정말 다녀왔다면 그 자리에서 찍은 사진을 붙여 보렴. 사진은 이 기기에만 남는다.',

    journalTitle: '할머니의 수첩 3권', tabMap: '지도', tabList: '칸', went: '갔다', saw: '봤다', missed: '못 봤다', go: '가기', here: '지금 이 자리입니다.',

  mineFor = id;
  const sq = squares.find(x => x.id === id), my = mine.get(id);
  $('mineTitle').textContent = `${sq ? nameOf(sq) : q('name')} · ${t('mineTitle')}`;
  $('mineShow').classList.toggle('on', Boolean(my)); if (my) $('mineShow').src = my.url;
  $('mineSay').textContent = thanks ? t('mineThanks') : '';
  $('mineDrop').style.display = my ? '' : 'none';
  $('mine').classList.add('on');
}
$('mineButton').onclick = () => openMine(HERE);
$('closeMine').onclick = () => $('mine').classList.remove('on');
$('mine').onclick = e => { if (e.target === $('mine')) $('mine').classList.remove('on'); };
$('mineDrop').onclick = () => { keepMine(mineFor, null); openMine(mineFor); };
$('mineFile').onchange = e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  const im = new Image();
  im.onload = () => { keepMine(mineFor, { url: shrink(im, im.naturalWidth, im.naturalHeight), at: todayText() }); URL.revokeObjectURL(im.src); openMine(mineFor, true); };
  im.src = URL.createObjectURL(file);
};

// 그 자리에서 찍기: 카메라 화면 위에 할머니의 사진을 반투명으로 겹쳐 놓는다. 게임에서 하던 포개기를 현실에서 한다.
// 할머니의 사진은 지금 서 있는 칸의 것만 있다. 다른 칸의 사진을 찍을 때는 겹치는 것 없이 찍는다.
let camStream = null, ghostOn = true;
function camLayout() {
  const g = $('camGhost'), w = W * 0.86, h = w * frame.h / frame.w, dpr = window.devicePixelRatio || 1;
  g.style.width = w + 'px'; g.style.height = h + 'px'; g.style.top = (H - h) / 2 - 30 + 'px';
  g.width = w * dpr; g.height = h * dpr;
  const c = g.getContext('2d'); c.clearRect(0, 0, g.width, g.height);
  const has = ghostOn && mineFor === HERE;
  if (has) { c.globalAlpha = 0.5; c.drawImage(photo, frame.x * dpr, frame.y * dpr, frame.w * dpr, frame.h * dpr, 0, 0, g.width, g.height); c.globalAlpha = 1; }
  $('camToggle').textContent = ghostOn ? t('camGhostOff') : t('camGhostOn');
  $('camToggle').style.visibility = mineFor === HERE ? 'visible' : 'hidden';
  $('camHint').style.visibility = has ? 'visible' : 'hidden';
}
function closeCam() {
  if (camStream) for (const track of camStream.getTracks()) track.stop();
  camStream = null; $('camVideo').srcObject = null; $('cam').classList.remove('on');
}
$('mineCam').onclick = async () => {
  if (!navigator.mediaDevices?.getUserMedia) { toast(t('camNo')); return; }
  try { camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 } }, audio: false }); }
  catch { toast(t('camNo')); return; }
  $('camVideo').srcObject = camStream; $('camVideo').play();
  $('mine').classList.remove('on'); $('cam').classList.add('on'); camLayout();
};
$('camToggle').onclick = () => { ghostOn = !ghostOn; camLayout(); };
$('camClose').onclick = () => { closeCam(); openMine(mineFor); };
$('camShoot').onclick = () => {
  const v = $('camVideo'); if (!v.videoWidth) return;
  // 화면에 보이던 틀 안의 그림만 담는다. 영상은 화면에 꽉 차게(cover) 놓여 있으므로 틀이 영상의 어디인지 셈한다.
  const k = Math.max(W / v.videoWidth, H / v.videoHeight), box = $('camGhost').getBoundingClientRect(), stage = ph.getBoundingClientRect();
  const sx = (v.videoWidth - W / k) / 2 + (box.left - stage.left) / k, sy = (v.videoHeight - H / k) / 2 + (box.top - stage.top) / k;
  const c = document.createElement('canvas'); c.width = 960; c.height = Math.round(960 * box.height / box.width);
  c.getContext('2d').drawImage(v, sx, sy, box.width / k, box.height / k, 0, 0, c.width, c.height);
  keepMine(mineFor, { url: c.toDataURL('image/jpeg', 0.82), at: todayText() });
  shutter(); closeCam(); openMine(mineFor, true);
};

// ── 수첩 ────────────────────────────────────────────────────────────
// 칸 100개(assets/squares.js). 시험판에 그림이 있는 칸은 63번 첨성대와 68번 부석사 둘이다. 채운 칸은 기억한다.
const FILLED_KEY = 'koreaoddity.filled.v1';
const squares = typeof SQUARES === 'undefined' ? [] : SQUARES;
const filled = new Set(stored(FILLED_KEY, '').split(',').filter(Boolean));
function fill(id) { filled.add(id); store(FILLED_KEY, [...filled].join(',')); showJournal(); }
const REGION_COLOR = { '서울·경기·인천': '#3b5bb5', '강원': '#2f8f7a', '충청': '#b5803b', '전라': '#5a8c4a', '경상': '#b9502c', '제주': '#8a4fa8', '섬과 끝': '#3b2a1a' };
// 그 말의 이름 하나만 보인다(한글을 나란히 적지 않는다). 일본어와 중국어에 아직 이름이 없는 칸만 한글이 보인다.
const nameOf = sq => lang === 'ja' ? sq.ja ?? sq.ko : lang === 'zh' ? sq.zh ?? sq.ko : sq.ko;
let picked = null, journalTab = 'map';

function showJournal() {
  $('journalTitle').textContent = t('journalTitle'); $('journalCount').textContent = `${filled.size}/100` + (mine.size ? ` · ${t('visited')} ${mine.size}` : '');
  document.querySelectorAll('#journalTabs button').forEach(b => { b.textContent = t(b.dataset.tab === 'map' ? 'tabMap' : 'tabList'); b.classList.toggle('on', b.dataset.tab === journalTab); });
  document.querySelectorAll('#journal section').forEach(el => el.classList.toggle('on', el.dataset.tab === journalTab));
  let html = '', region = null;
  for (const sq of squares) {
    if (sq.region !== region) { region = sq.region; html += `<h2>${t('regions')[region]}</h2>`; }
    html += `<div data-id="${sq.id}" class="${filled.has(sq.id) ? 'done' : ''}"><i>${sq.no}</i><b class="${mine.has(sq.id) ? 'real' : ''}">${nameOf(sq)}</b><em>${t(sq.grandma)}</em><small>${lang === 'ko' ? sq.where + ' · ' + sq.what : ''}</small></div>`;
  }
  $('journalList').innerHTML = html;
  showCard();
  if ($('journal').classList.contains('on') && journalTab === 'map') drawMap();
}
function showCard() {
  const sq = squares.find(x => x.id === picked);
  if (!sq) { $('mapCard').textContent = t('pick'); return; }
  const sub = [lang === 'ko' ? sq.where : '', t(sq.grandma)].filter(Boolean).join(' · ');
  $('mapCard').innerHTML = `<b>${sq.no} ${nameOf(sq)}</b><br>${sub}${lang === 'ko' ? '<br>' + sq.what + ' · ' + sq.best : ''}${sq.rough ? '<br><small>' + t('rough') + '</small>' : ''}<br><button id="goSquare">${t('go')}</button><button id="mineSquare">${t('mine')}${mine.has(sq.id) ? ' ★' : ''}</button>`;
  $('mineSquare').onclick = () => openMine(sq.id);
  $('goSquare').onclick = () => { if (sq.id === HERE) { $('journal').classList.remove('on'); toast(t('here')); } else if (SCENES[sq.id]) go(sq.id); else toast(t('noArt')); };
}
// 지도: 땅은 Natural Earth 의 바닷가 선(assets/coast.js)이고, 그 위에 칸 100개의 점을 찍는다.
const MAP = { lon0: 124.4, lon1: 131.1, lat0: 33.0, lat1: 38.8, squeeze: Math.cos(36 * Math.PI / 180) };
let mapDots = [];
function drawMap() {
  const c = $('mapCanvas'), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (!r.width) return;
  c.width = r.width * dpr; c.height = r.height * dpr;
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const wu = (MAP.lon1 - MAP.lon0) * MAP.squeeze, hu = MAP.lat1 - MAP.lat0, k = Math.min((r.width - 16) / wu, (r.height - 16) / hu);
  const ox = (r.width - wu * k) / 2, oy = (r.height - hu * k) / 2;
  const X = lon => ox + (lon - MAP.lon0) * MAP.squeeze * k, Y = lat => oy + (MAP.lat1 - lat) * k;
  g.save(); g.beginPath(); g.rect(ox, oy, wu * k, hu * k); g.clip();
  g.fillStyle = '#e3d3a6'; g.strokeStyle = '#a8946a'; g.lineWidth = 1; g.lineJoin = 'round';
  for (const land of typeof COAST === 'undefined' ? [] : COAST) {
    g.beginPath();
    for (let i = 0; i < land.length; i += 2) g.lineTo(X(land[i]), Y(land[i + 1]));
    g.closePath(); g.fill(); g.stroke();
  }
  g.restore();
  g.strokeStyle = 'rgba(59,42,26,.12)'; g.lineWidth = 1;   // 위도와 경도 1도마다 옅은 줄
  for (let lon = 125; lon <= 131; lon++) { const x = ox + (lon - MAP.lon0) * MAP.squeeze * k; g.beginPath(); g.moveTo(x, oy); g.lineTo(x, oy + hu * k); g.stroke(); }
  for (let lat = 33; lat <= 38; lat++) { const y = oy + (MAP.lat1 - lat) * k; g.beginPath(); g.moveTo(ox, y); g.lineTo(ox + wu * k, y); g.stroke(); }
  mapDots = squares.map(sq => ({ sq, x: ox + (sq.lon - MAP.lon0) * MAP.squeeze * k, y: oy + (MAP.lat1 - sq.lat) * k }));
  for (const { sq, x, y } of mapDots) {
    g.beginPath(); g.arc(x, y, filled.has(sq.id) ? 6 : 4.2, 0, 6.2832);
    g.fillStyle = filled.has(sq.id) ? '#f6b951' : REGION_COLOR[sq.region]; g.globalAlpha = filled.has(sq.id) ? 1 : 0.8; g.fill(); g.globalAlpha = 1;
    if (filled.has(sq.id)) { g.strokeStyle = '#3b2a1a'; g.lineWidth = 1.5; g.stroke(); }
    else if (SCENES[sq.id]) { g.fillStyle = '#fbf8f9'; g.beginPath(); g.arc(x, y, 1.8, 0, 6.2832); g.fill(); }   // 그림이 있는 칸은 가운데가 희다
  }
  for (const { sq, x, y } of mapDots) if (mine.has(sq.id)) {   // 정말 다녀온 곳: 금빛 테를 한 겹 더
    g.strokeStyle = '#b5803b'; g.lineWidth = 2; g.beginPath(); g.arc(x, y, 9, 0, 6.2832); g.stroke();
  }
  const p = mapDots.find(d => d.sq.id === picked);
  if (p) { g.strokeStyle = '#3b2a1a'; g.lineWidth = 2; g.beginPath(); g.arc(p.x, p.y, 10, 0, 6.2832); g.stroke(); }
}
$('mapCanvas').addEventListener('pointerdown', e => {
  const r = $('mapCanvas').getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let best = null, bd = 22;
  for (const d of mapDots) { const q = Math.hypot(d.x - x, d.y - y); if (q < bd) { bd = q; best = d; } }
  if (best) { picked = best.sq.id; showCard(); drawMap(); }
});
$('journalList').onclick = e => { const row = e.target.closest('div[data-id]'); if (row) { picked = row.dataset.id; journalTab = 'map'; showJournal(); } };
document.querySelectorAll('#journalTabs button').forEach(b => { b.onclick = () => { journalTab = b.dataset.tab; showJournal(); }; });
$('journalButton').onclick = () => { $('journal').classList.add('on'); showJournal(); };
$('closeJournal').onclick = () => $('journal').classList.remove('on');
addEventListener('resize', () => { if ($('journal').classList.contains('on')) drawMap(); });
// ── 설정의 갈래와 바뀐 것들 ─────────────────────────────────────────
// 1권의 설정처럼 갈래를 둔다. "Changes" 쪽은 날마다 바뀐 것을 한 줄씩 보인다(assets/changes.js ← docs/바뀐-것들.md).
// 날짜는 그날의 첫 줄에만 적는다. 맨 위에 만들기 시작한 날과 오늘로 며칠째인지를 적는다. 그날이 1일째다.
const NEWS = typeof CHANGES === 'undefined' ? [] : CHANGES;
const stamp = day => { const [y, m, d] = day.split('-').map(Number); return Date.UTC(y, m - 1, d); };
function renderNews() {
  const now = new Date(), today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  if (typeof CHANGES_STARTED !== 'undefined') {
    const [y, m, d] = CHANGES_STARTED.split('-').map(Number), days = Math.round((stamp(today) - stamp(CHANGES_STARTED)) / 86400000) + 1;
    const began = t('started').replace('{y}', y).replace('{m}', m).replace('{d}', d);
    $('newsStarted').textContent = days >= 1 ? `${began}\n${t('days').replace('{n}', days.toLocaleString())}` : began;
  }
  const words = (typeof CHANGE_WORDS === 'undefined' ? {} : CHANGE_WORDS)[lang] ?? {};
  let lastDay = null;
  $('newsList').replaceChildren(...NEWS.filter(c => stamp(c.day) <= stamp(today)).map(({ day, text }) => {
    const item = document.createElement('li'), when = document.createElement('time');
    const [, month, date] = day.split('-').map(Number);
    when.dateTime = day; when.textContent = day === lastDay ? '' : `${month}.${date}`; lastDay = day;
    item.append(when, words[text] ?? text);
    return item;
  }));
}
function showTab(name) {
  document.querySelectorAll('#settingsTabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
  document.querySelectorAll('#settings section').forEach(el => { el.hidden = el.dataset.tab !== name; });
  if (name === 'news') $('settings').querySelector('section[data-tab="news"]').scrollTop = 0;
}
document.querySelectorAll('#settingsTabs button').forEach(b => { b.onclick = () => showTab(b.dataset.tab); });
$('settingsButton').onclick = () => { renderNews(); showTab('options'); $('settings').classList.add('on'); };
$('closeSettings').onclick = () => $('settings').classList.remove('on');
$('settings').onclick = e => { if (e.target === $('settings')) $('settings').classList.remove('on'); };
document.querySelectorAll('#langRow button').forEach(b => { b.onclick = () => setLang(b.dataset.lang); });
setLang(lang);

let prev = performance.now();
function loop(now) {
  const dt = Math.min(50, now - prev); prev = now;
  tick(dt); sound(); if (music) music.tick('near'); showSora(now);
  if (!(dragging || Math.abs(vp) > 0.015)) dv += (d - dv) * Math.min(1, dt * 0.01);
  drawAll(); requestAnimationFrame(loop);
}
addEventListener('resize', layout);
layout();
// 주소 끝에 #near 나 #shot 을 붙이면 그 장면에서 시작한다. 화면을 그림 파일로 찍을 때 쓴다.
if (location.hash === '#near' || location.hash === '#shot') { d = dv = anchor = GOOD; $('hint').style.opacity = 0; cam.x = TARGET.x - 22; cam.y = TARGET.y + 9; }
if (location.hash === '#shot') { cam.x = TARGET.x; cam.y = TARGET.y; touched = true; }
if (location.hash === '#settings') $('settings').classList.add('on');
if (location.hash === '#changes') { renderNews(); showTab('news'); $('settings').classList.add('on'); }
if (location.hash === '#story') openCard('story');
if (location.hash === '#route') openCard('route');
if (location.hash === '#mine') openMine(HERE);
if (location.hash === '#journal' || location.hash === '#list') { picked = HERE; journalTab = location.hash === '#list' ? 'list' : 'map'; $('journal').classList.add('on'); showJournal(); }
if (location.hash === '#hush') { muted = true; showSound(); hush(); hushHold = true; }   // 넷째 그림에서 멈춘다
requestAnimationFrame(loop);
</script>
</body>
