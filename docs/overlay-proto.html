<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>팔도 한량 사진 포개기 손맛 시험</title>
<style>
/* 손맛만 보려고 만든 시험판이다. 게임 코드가 아니다. 땅 그림은 임시로 그린 것이고, 절기 날짜는 어림이다. */
:root{--night:#050330;--navy:#1a2894;--gold:#f6b951;--white:#fbf8f9;--lav:#e2daf6;--paper:#f2e6c8;--ink:#3b2a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#15122b;overflow:hidden;overscroll-behavior:none}
body{display:grid;place-items:center;font-family:"Malgun Gothic",system-ui,sans-serif;color:var(--white);user-select:none;-webkit-user-select:none}
#ph{position:relative;width:min(100vw,420px);height:min(100dvh,860px);overflow:hidden;background:#141c7c}
#ph>*{position:absolute}
canvas.full{inset:0;width:100%;height:100%;pointer-events:none}
.glass{background:rgba(5,3,48,.6);border:1px solid rgba(226,218,246,.45);border-radius:16px}
#date{top:14px;left:16px;pointer-events:none;text-shadow:0 1px 6px rgba(5,3,48,.7)}
#date b{display:block;font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
#date span{font-size:13px}
#name{top:92px;left:16px;font-size:12px;padding:4px 10px;pointer-events:none}
#jump{right:14px;top:16px;padding:9px 14px;color:var(--gold);border-color:var(--gold);font:inherit;font-size:13px}
#hint{left:50%;transform:translateX(-50%);padding:6px 12px;font-size:12px;white-space:nowrap;transition:opacity .4s;pointer-events:none}
#memo{left:14px;max-width:70%;background:var(--paper);color:var(--ink);padding:6px 10px 5px;transform:rotate(-1.5deg);
  box-shadow:1px 2px 0 rgba(59,42,26,.4);pointer-events:none}
#memo b{display:block;font-family:"Nanum Pen Script","Gowun Batang",cursive;font-weight:400;font-size:21px;line-height:1.15}
#memo small{display:block;font-size:10.5px;opacity:.75;margin-top:2px}
#sora{left:10px;bottom:118px;width:84px;image-rendering:pixelated;pointer-events:none}
#bubble{left:88px;bottom:190px;background:var(--white);color:#1b1730;padding:6px 10px;border-radius:12px 12px 12px 2px;
  font-size:12.5px;white-space:nowrap;transition:opacity .25s;opacity:0;pointer-events:none}
#fly,#hit{touch-action:none;cursor:grab}
#fly{left:0;right:0;top:0;bottom:120px}
#hit{left:0;right:0;bottom:0;height:120px}
#flash{inset:0;background:#fff;opacity:0;pointer-events:none}
#post{left:50%;transform:translateX(-50%) rotate(-1.2deg);background:#f7efd9;color:var(--ink);padding:10px 10px 6px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);display:none}
#post div{display:flex;gap:6px}
#post canvas{display:block;border:1px solid #cbb98c;border-radius:6px}
#post p{margin:6px 2px 0;display:flex;justify-content:space-between;font-family:"Nanum Pen Script","Gowun Batang",cursive;font-size:20px;line-height:1.1}
#again{left:50%;transform:translateX(-50%);padding:9px 16px;color:var(--white);font:inherit;font-size:13px;display:none}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
</head>
<body>
<div id="ph">
  <canvas id="scene" class="full"></canvas>
  <canvas id="dial" class="full"></canvas>
  <div id="memo"><b>1985.11. 저녁. 산이 겹겹이 보였다.</b><small>1985.11. 夕方。山が幾重にも見えた。</small></div>
  <img id="sora" src="mock/sora.png" alt="소라">
  <div id="bubble"></div>
  <div id="date"><b></b><span></span></div>
  <div id="name" class="glass">浮石寺 · 부석사 · プソクサ</div>
  <div id="hint" class="glass">화면을 끌어 사진과 산을 포개 보렴</div>
  <div id="fly"></div>
  <div id="hit"></div>
  <button id="jump" class="glass"></button>
  <div id="post"><div><canvas id="pl"></canvas><canvas id="pr"></canvas></div><p><span>1985.11</span><span id="pd"></span></p></div>
  <button id="again" class="glass">다시 찾기</button>
  <div id="flash"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const ph = $('ph'), scene = $('scene'), dial = $('dial'), fly = $('fly'), hit = $('hit');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mod = (v, n) => ((v % n) + n) % n;
const smooth = t => t * t * (3 - 2 * t);

// ── 날 ──────────────────────────────────────────────────────────────
// 날은 1월 1일을 0으로 센 번호다(0 → 364). 한 해가 돌면 제자리로 온다.
const YEAR = 365, STEP = 5, PX = 12;   // 눈금 한 칸(12픽셀)이 5일이다. 365 = 73칸.
const TODAY = 279;                     // 10.7
const GOOD = TODAY + 30;               // 11.6. 이 칸의 좋은 때(가을 저녁). 눈금 위에 있다.
const MONTH0 = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
// 24절기가 시작하는 날 번호(어림, 하루쯤 어긋날 수 있다)와 한자. 세 나라가 같이 읽는다.
const TERMS = [[4, '小寒'], [19, '大寒'], [34, '立春'], [49, '雨水'], [63, '驚蟄'], [78, '春分'], [93, '清明'], [109, '穀雨'],
  [124, '立夏'], [140, '小滿'], [155, '芒種'], [171, '夏至'], [187, '小暑'], [202, '大暑'], [218, '立秋'], [234, '處暑'],
  [249, '白露'], [265, '秋分'], [280, '寒露'], [295, '霜降'], [310, '立冬'], [325, '小雪'], [340, '大雪'], [355, '冬至']];
const TERM_AT = new Map(TERMS);
function dateText(n) {
  const m = mod(Math.round(n), YEAR);
  let i = 11; while (MONTH0[i] > m) i--;
  return `${i + 1}.${m - MONTH0[i] + 1}`;
}
function termOf(n) {
  const m = mod(Math.round(n), YEAR);
  let t = TERMS[TERMS.length - 1][1];
  for (const [s, name] of TERMS) if (s <= m) t = name;
  return t;
}
// a에서 b까지 가장 가까운 길(-182 → 182일)
const gap = (a, b) => mod(b - a + YEAR / 2, YEAR) - YEAR / 2;

// ── 색판 ────────────────────────────────────────────────────────────
// 한 구도에 색판 넷이다. 산 다섯 겹은 먼 것부터 적는다.
const hex = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));
const PAL = {
  winter: { top: '#aebbd4', bot: '#f0d9cf', sun: '#fff1dc', r: ['#cfd6e2', '#b4bfcf', '#98a6ba', '#7c8ba3', '#5f6f89'], ground: '#d9dde6' },
  spring: { top: '#a9c8ea', bot: '#f8dcc6', sun: '#fff0c8', r: ['#b9c7d8', '#9fb8a8', '#86ad84', '#6f9f63', '#5a8c4a'], ground: '#b7c28c' },
  summer: { top: '#7fb4e2', bot: '#f6e2b0', sun: '#fff3b8', r: ['#9db7c9', '#6fa58d', '#4f9468', '#3b7f4d', '#2c6a3b'], ground: '#9db06a' },
  autumn: { top: '#d7a98f', bot: '#f9b765', sun: '#ffe2a0', r: ['#c9b8c4', '#c89a7a', '#c9743f', '#b9502c', '#8f3a22'], ground: '#c9a56a' },
};
for (const p of Object.values(PAL)) { for (const k of ['top', 'bot', 'sun', 'ground']) p[k] = hex(p[k]); p.r = p.r.map(hex); }
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const mixPal = (a, b, t) => ({ top: mix(a.top, b.top, t), bot: mix(a.bot, b.bot, t), sun: mix(a.sun, b.sun, t), ground: mix(a.ground, b.ground, t), r: a.r.map((v, i) => mix(v, b.r[i], t)) });
const css = c => `rgb(${c.map(Math.round).join(',')})`;
// 철의 한가운데: 겨울 1.16, 봄 4.16, 여름 7.20, 가을 10.28. 그 사이는 녹여 잇는다.
const SEASONS = [[15, 'winter'], [105, 'spring'], [200, 'summer'], [300, 'autumn']];
function seasonAt(n) {
  const m = mod(n, YEAR);
  for (let i = 0; i < 4; i++) {
    const [a, an] = SEASONS[i], [b0, bn] = SEASONS[(i + 1) % 4], b = i === 3 ? b0 + YEAR : b0;
    const x = m < SEASONS[0][0] ? m + YEAR : m;
    if (x >= a && x < b) {
      const t = smooth((x - a) / (b - a)), w = { winter: 0, spring: 0, summer: 0, autumn: 0 };
      w[an] = 1 - t; w[bn] += t;
      return { pal: mixPal(PAL[an], PAL[bn], t), w };
    }
  }
}
// 할머니 사진: 1985년 11월의 가을 색을 노랗게 바랜 것
const FADE = [236, 208, 150];
const PHOTO = mixPal(PAL.autumn, { top: FADE, bot: FADE, sun: FADE, ground: FADE, r: [FADE, FADE, FADE, FADE, FADE] }, 0.52);

// ── 땅 그림(임시) ───────────────────────────────────────────────────
// 종이를 오려 겹친 그림이다. 가까운 겹일수록 소라가 움직일 때 많이 밀린다. 그래서 한 자리에서만 다섯 능선이 모두 포개진다.
const K = [0.10, 0.20, 0.34, 0.52, 0.74], BASE = [0.300, 0.330, 0.362, 0.398, 0.436], AMP = [13, 16, 20, 24, 28];
const F = [150, 120, 100, 85, 70], P = [0.7, 2.1, 4.4, 1.3, 5.2];
const ridge = (i, xw) => 0.5 * Math.sin(xw / F[i] + P[i]) + 0.3 * Math.sin(xw / (F[i] * 0.41) + P[i] * 2.3) + 0.2 * Math.sin(xw / (F[i] * 0.19) + P[i] * 4.1);
const BLOSSOM = Array.from({ length: 46 }, (_, i) => [Math.abs(Math.sin(i * 12.9898) * 43758.5453) % 1, Math.abs(Math.sin(i * 78.233) * 12543.123) % 1]);

let W = 0, H = 0;
function ridgePath(c, i, cam) {
  c.beginPath(); c.moveTo(0, H);
  for (let sx = 0; sx <= W + 4; sx += 4) c.lineTo(sx, H * BASE[i] + cam.y * K[i] - AMP[i] * ridge(i, sx + cam.x * K[i]));
  c.lineTo(W, H); c.closePath();
}
function drawScene(c, cam, pal, w, outline) {
  const g = c.createLinearGradient(0, 0, 0, H * 0.5);
  g.addColorStop(0, css(pal.top)); g.addColorStop(1, css(pal.bot));
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  c.fillStyle = css(pal.sun); c.beginPath(); c.arc(W * 0.7 - cam.x * 0.03, H * 0.275 + cam.y * 0.03, 16, 0, 6.2832); c.fill();
  for (let i = 0; i < 5; i++) {
    c.save();
    c.shadowColor = 'rgba(40,30,20,.3)'; c.shadowBlur = 7; c.shadowOffsetY = -2;   // 종이 겹의 그림자
    ridgePath(c, i, cam); c.fillStyle = css(pal.r[i]); c.fill();
    c.restore();
    if (w.winter > 0.02) { ridgePath(c, i, cam); c.save(); c.clip(); c.strokeStyle = `rgba(255,255,255,${0.8 * w.winter})`; c.lineWidth = 9 + i * 2; c.stroke(); c.restore(); }
    if (outline) { ridgePath(c, i, cam); c.strokeStyle = 'rgba(59,42,26,.5)'; c.lineWidth = 1.2; c.stroke(); }
  }
  if (w.spring > 0.02) {   // 봄에만 분홍
    c.fillStyle = `rgba(247,178,205,${0.9 * w.spring})`;
    for (const [u, v] of BLOSSOM) {
      const xw = u * 700 - 160, sx = xw - cam.x * K[4];
      const y = H * BASE[4] + cam.y * K[4] - AMP[4] * ridge(4, xw) + 5 + v * 26;
      c.beginPath(); c.arc(sx, y, 3 + v * 3, 0, 6.2832); c.fill();
    }
  }
  // 무량수전 지붕과 마당. 가장 가까운 겹이다.
  const cx = W * 0.5 - cam.x, ry = H * 0.47 + cam.y;
  c.fillStyle = css(pal.ground); c.fillRect(0, ry + 138, W, H);
  c.fillStyle = css(mix(pal.ground, [236, 222, 190], 0.6)); c.fillRect(cx - 150, ry + 58, 300, 84);
  c.fillStyle = '#6b2f24'; for (let i = 0; i < 6; i++) c.fillRect(cx - 150 + i * 58.4, ry + 58, 8, 84);
  c.save(); c.shadowColor = 'rgba(40,30,20,.35)'; c.shadowBlur = 8; c.shadowOffsetY = -2;
  c.beginPath(); c.moveTo(cx - 186, ry + 46); c.quadraticCurveTo(cx - 122, ry + 48, cx - 92, ry + 8);
  c.lineTo(cx - 98, ry); c.lineTo(cx + 98, ry); c.lineTo(cx + 92, ry + 8);
  c.quadraticCurveTo(cx + 122, ry + 48, cx + 186, ry + 46); c.lineTo(cx + 176, ry + 60);
  c.quadraticCurveTo(cx, ry + 74, cx - 176, ry + 60); c.closePath();
  c.fillStyle = '#2b2433'; c.fill(); c.restore();
  if (w.winter > 0.02) { c.strokeStyle = `rgba(255,255,255,${0.85 * w.winter})`; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.moveTo(cx - 96, ry + 1); c.lineTo(cx + 96, ry + 1); c.stroke(); }
  if (outline) { c.strokeStyle = 'rgba(59,42,26,.5)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(cx - 98, ry); c.lineTo(cx + 98, ry); c.stroke(); }
}

// ── 상태 ────────────────────────────────────────────────────────────
const TARGET = { x: 46, y: -18 };   // 할머니가 섰던 자리
const cam = { x: -124, y: 30 }, cv = { x: 0, y: 0 };
let shot = false, flying = false, touched = false;
let d = TODAY, dv = TODAY;          // 다이얼이 선 날, 다이얼이 그려지는 자리
let dragging = false, d0 = d, acc = 0, vp = 0, target = null, moved = false, lastX = 0, lastT = 0;
let frame = { x: 0, y: 0, w: 0, h: 0 };
const photo = document.createElement('canvas'), snap = document.createElement('canvas');
const NOSEASON = { winter: 0, spring: 0, summer: 0, autumn: 1 };

function layout() {
  const r = ph.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  for (const c of [scene, dial, photo, snap]) { c.width = W * dpr; c.height = H * dpr; c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0); }
  const fw = W * 0.74, fh = fw * 0.72;
  frame = { x: (W - fw) / 2, y: H * 0.205, w: fw, h: fh };
  drawScene(photo.getContext('2d'), TARGET, PHOTO, NOSEASON, true);
  $('memo').style.top = frame.y + fh + 16 + 'px';
  $('hint').style.top = frame.y - 40 + 'px';
  $('post').style.top = frame.y - 6 + 'px';
  $('again').style.top = frame.y + fh + 84 + 'px';
  for (const id of ['pl', 'pr']) { const c = $(id); c.width = fw * 0.5 * dpr; c.height = fh * 0.5 * dpr; c.style.width = fw * 0.5 + 'px'; c.style.height = fh * 0.5 + 'px'; }
  if (shot) fillPost();
}

// ── 손가락 ──────────────────────────────────────────────────────────
// 맨 아래 120픽셀은 다이얼, 그 위는 날기다. 손가락을 처음 댄 자리로 정한다.
fly.addEventListener('pointerdown', e => { if (shot) return; fly.setPointerCapture(e.pointerId); flying = true; cv.x = cv.y = 0; lastX = e.clientX; fly._y = e.clientY; lastT = performance.now(); if (!touched) { touched = true; $('hint').style.opacity = 0; } });
fly.addEventListener('pointermove', e => {
  if (!flying) return;
  const now = performance.now(), dt = Math.max(4, now - lastT), dx = e.clientX - lastX, dy = e.clientY - fly._y;
  move(-dx, dy); cv.x += (-dx / dt - cv.x) * 0.35; cv.y += (dy / dt - cv.y) * 0.35;
  lastX = e.clientX; fly._y = e.clientY; lastT = now;
});
for (const ev of ['pointerup', 'pointercancel']) fly.addEventListener(ev, () => { flying = false; });
function move(dx, dy) { cam.x = clamp(cam.x + dx, -170, 170); cam.y = clamp(cam.y + dy, -44, 44); }

hit.addEventListener('pointerdown', e => {
  hit.setPointerCapture(e.pointerId); dragging = true; target = null; vp = 0; d0 = d;
  acc = clamp((d - dv) / STEP, -0.5, 0.5) * PX;   // 굴러가던 호를 잡으면 그 자리에서 이어 끈다
  lastX = e.clientX; lastT = performance.now();
});
hit.addEventListener('pointermove', e => {
  if (!dragging) return;
  const now = performance.now(), dt = Math.max(4, now - lastT), dx = e.clientX - lastX;
  vp += (dx / dt - vp) * 0.35; step(dx); moved = true; lastX = e.clientX; lastT = now;
});
for (const ev of ['pointerup', 'pointercancel']) hit.addEventListener(ev, () => { dragging = false; vp = clamp(vp, -1.5, 1.5); });
// 오른쪽으로 끌면 지난 날이 온다. 한 칸에 꼭 5일씩 넘어간다.
function step(dpx) { acc += dpx; d = d0 - Math.round(acc / PX) * STEP; dv = d0 - acc / PX * STEP; }

function tick(dt) {
  // 날기: 놓으면 조금 미끄러지고, 할머니 자리 가까이에서 멈추면 그 자리로 끌려간다.
  if (!shot && !flying) {
    if (Math.hypot(cv.x, cv.y) > 0.02) { move(cv.x * dt, cv.y * dt); cv.x *= Math.exp(-dt / 220); cv.y *= Math.exp(-dt / 220); }
    else if (touched && dist() < 14) { cam.x += (TARGET.x - cam.x) * Math.min(1, dt * 0.01); cam.y += (TARGET.y - cam.y) * Math.min(1, dt * 0.01); }
  }
  if (!shot && touched && dist() < 2.5) capture();
  // 다이얼
  if (dragging) { if (performance.now() - lastT > 70) vp *= 0.7; return; }
  if (target !== null) {
    d += (target - d) * Math.min(1, dt * 0.008);
    if (Math.abs(target - d) < 0.3) { d = target; target = null; }
    return;
  }
  if (Math.abs(vp) > 0.015) { step(vp * dt); vp *= Math.exp(-dt / 500); moved = true; return; }
  vp = 0;
  if (moved) {   // 좋은 때에서 한 칸 안에 멈추면 그날에 걸린다
    moved = false; d0 = d; acc = 0;
    const off = gap(d, GOOD);
    if (off !== 0 && Math.abs(off) <= STEP) target = d + off;
  }
}
const dist = () => Math.hypot(cam.x - TARGET.x, cam.y - TARGET.y);

// ── 찍기 ────────────────────────────────────────────────────────────
let shotDay = TODAY;   // 찍은 날. 화면 크기가 바뀌면 이 날의 색으로 엽서를 다시 그린다.
function fillPost() {
  const s = seasonAt(shotDay), dpr = window.devicePixelRatio || 1;
  drawScene(snap.getContext('2d'), TARGET, s.pal, s.w, false);
  for (const [id, src] of [['pl', photo], ['pr', snap]]) {
    const c = $(id); c.getContext('2d').drawImage(src, frame.x * dpr, frame.y * dpr, frame.w * dpr, frame.h * dpr, 0, 0, c.width, c.height);
  }
}
function capture() {
  shot = true; cam.x = TARGET.x; cam.y = TARGET.y; cv.x = cv.y = 0;
  shotDay = dv; fillPost();
  $('pd').textContent = dateText(d);
  $('post').style.display = 'block'; $('again').style.display = 'block';
  $('bubble').textContent = '겹쳤다! 산은 그대로네.'; $('bubble').style.opacity = 1;
  if (location.hash === '#shot') return;   // 그림 파일로 찍을 때는 번쩍임을 뺀다
  const f = $('flash'); f.style.transition = 'none'; f.style.opacity = 0.9;
  requestAnimationFrame(() => { f.style.transition = 'opacity .5s'; f.style.opacity = 0; });
  shutter();
}
$('again').onclick = () => {
  shot = false; touched = false; $('post').style.display = $('again').style.display = 'none'; $('bubble').style.opacity = 0; $('hint').style.opacity = 1;
  const a = Math.random() * 6.2832; cam.x = clamp(TARGET.x + Math.cos(a) * 150, -170, 170); cam.y = Math.sin(a) > 0 ? 40 : -40;
};
$('jump').onclick = () => { vp = 0; const to = gap(d, GOOD) === 0 ? TODAY : GOOD; target = d + gap(d, to); };

// ── 그리기 ──────────────────────────────────────────────────────────
function drawAll() {
  const c = scene.getContext('2d'), s = seasonAt(dv), dpr = window.devicePixelRatio || 1;
  drawScene(c, cam, s.pal, s.w, false);
  if (!shot) {
    const near = clamp(1 - dist() / 40, 0, 1), f = frame;
    c.save(); c.beginPath(); c.roundRect(f.x, f.y, f.w, f.h, 12); c.clip();
    c.globalAlpha = 0.6; c.drawImage(photo, f.x * dpr, f.y * dpr, f.w * dpr, f.h * dpr, f.x, f.y, f.w, f.h); c.restore();
    c.save(); c.shadowColor = 'rgba(5,3,48,.5)'; c.shadowBlur = 10;
    c.strokeStyle = css(mix([251, 248, 249], [246, 185, 81], near)); c.lineWidth = 4 + near * 2;
    c.beginPath(); c.roundRect(f.x, f.y, f.w, f.h, 12); c.stroke(); c.restore();
  }
  // 다이얼: 큰 호. 시간 한량의 다이얼과 움직임, 소리가 같고 범위만 한 해다.
  const k = dial.getContext('2d'); k.clearRect(0, 0, W, H);
  const R = W * 1.15, cx = W / 2, cy = H - 100 + R, z = PX / STEP, span = Math.ceil(R * 0.7 / z);
  k.fillStyle = 'rgba(5,3,48,.78)'; k.beginPath(); k.arc(cx, cy, R, 0, 6.2832); k.fill();
  k.strokeStyle = '#f6b951'; k.lineWidth = 2; k.stroke();
  k.textAlign = 'center'; k.textBaseline = 'middle';
  for (let n = Math.floor(dv - span); n <= dv + span; n++) {
    const m = mod(n, YEAR), mi = MONTH0.indexOf(m), term = TERM_AT.get(m), isTick = mod(n - TODAY, STEP) === 0;
    if (!isTick && mi < 0 && !term) continue;
    k.save(); k.translate(cx, cy); k.rotate((n - dv) * z / R);
    if (isTick) { k.fillStyle = 'rgba(251,248,249,.9)'; k.fillRect(-0.5, -R + 2, 1, 8); }
    if (mi >= 0) { k.fillStyle = 'rgba(251,248,249,.9)'; k.fillRect(-1, -R + 2, 2, 16); k.font = '11px "Malgun Gothic",sans-serif'; k.fillText(`${mi + 1}월`, 0, -R + 28); }
    if (term) { k.fillStyle = '#f6b951'; k.font = '12px "Gowun Batang","Malgun Gothic",serif'; k.fillText(term, 0, -R + 48); }
    k.restore();
  }
  k.fillStyle = '#f6b951'; k.beginPath(); k.moveTo(cx - 8, H - 114); k.lineTo(cx + 8, H - 114); k.lineTo(cx, H - 98); k.fill();
  $('date').firstElementChild.textContent = dateText(d);
  $('date').lastElementChild.textContent = `${termOf(d)} · 영주, 경북 · 저녁`;
  $('jump').textContent = gap(Math.round(d), GOOD) === 0 ? '오늘로' : '좋은 때로';
}

// ── 소리 ────────────────────────────────────────────────────────────
// 눈금 소리는 시간 한량의 다이얼 시험판에서 그대로 옮겼다. 중심 1,200Hz, 달이 바뀌는 눈금은 760Hz.
let ac = null, noise = null, lastClick = 0, lastIdx = null;
function wake() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); noise = ac.createBuffer(1, ac.sampleRate * 0.045, ac.sampleRate);
    const b = noise.getChannelData(0);
    for (let i = 0; i < b.length; i++) b[i] = (Math.random() * 2 - 1) * Math.exp(-i / (b.length * 0.18));
  }
  if (ac.state === 'suspended') ac.resume();
}
addEventListener('pointerdown', wake);
function burst(freq, vol, when = 0) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), v = ac.createGain();
  s.buffer = noise; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.0; v.gain.value = vol;
  s.connect(f); f.connect(v); v.connect(ac.destination); s.start(ac.currentTime + when);
}
function click(big) {
  const now = performance.now(); if (!ac || now - lastClick < 22) return; lastClick = now;
  burst(big ? 760 : 1200, big ? 0.75 : 0.5);
  const o = ac.createOscillator(), og = ac.createGain(), t0 = ac.currentTime;
  o.type = 'sine'; o.frequency.setValueAtTime(big ? 240 : 340, t0); o.frequency.exponentialRampToValueAtTime(big ? 130 : 190, t0 + 0.035);
  og.gain.setValueAtTime(big ? 0.22 : 0.12, t0); og.gain.exponentialRampToValueAtTime(0.001, t0 + 0.04);
  o.connect(og); og.connect(ac.destination); o.start(t0); o.stop(t0 + 0.06);
}
function shutter() { if (!ac) return; burst(2400, 0.9); burst(900, 0.8, 0.07); }   // 셔터가 열리고 닫히는 소리(임시)
function sound() {
  const idx = Math.round((d - TODAY) / STEP);
  if (lastIdx !== null && idx !== lastIdx && target === null) {
    const a = Math.min(idx, lastIdx) * STEP + TODAY, b = Math.max(idx, lastIdx) * STEP + TODAY;
    click(MONTH0.some(m0 => mod(m0 - a - 1, YEAR) < b - a));   // 이 걸음에 달이 바뀌었는가
  }
  lastIdx = idx;
}

let prev = performance.now();
function loop(now) {
  const dt = Math.min(50, now - prev); prev = now;
  tick(dt); sound();
  if (!(dragging || Math.abs(vp) > 0.015)) dv += (d - dv) * Math.min(1, dt * 0.01);
  drawAll(); requestAnimationFrame(loop);
}
addEventListener('resize', layout);
layout();
// 주소 끝에 #near 나 #shot 을 붙이면 그 장면에서 시작한다. 화면을 그림 파일로 찍을 때 쓴다.
if (location.hash === '#near' || location.hash === '#shot') { d = dv = GOOD; $('hint').style.opacity = 0; cam.x = TARGET.x - 22; cam.y = TARGET.y + 9; }
if (location.hash === '#shot') { cam.x = TARGET.x; cam.y = TARGET.y; touched = true; }
requestAnimationFrame(loop);
</script>
</body>
